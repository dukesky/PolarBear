steps:
  # 1. Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/polarbear-repo/backend:${_TAG}', './backend']
    id: 'Build Backend'
    waitFor: ['-'] # Start immediately

  # 2. Build Frontend Image
  # NEXT_PUBLIC_* vars are inlined at build time — the backend URL must be a build arg.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/polarbear-repo/frontend:${_TAG}', '--build-arg', 'NEXT_PUBLIC_API_URL=${_BACKEND_URL}', './frontend']
    id: 'Build Frontend'
    waitFor: ['-'] # Start immediately (Parallel with Backend)

  # 3. Push Images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/polarbear-repo/backend:${_TAG}']
    id: 'Push Backend'
    waitFor: ['Build Backend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/polarbear-repo/frontend:${_TAG}']
    id: 'Push Frontend'
    waitFor: ['Build Frontend']

  # 4. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'polarbear-backend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/polarbear-repo/backend:${_TAG}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      # 1Gi was OOM-killed on a cold start: "Memory limit of 1024 MiB exceeded
      # with 1039 MiB used" (2026-09-18) — the embedding model plus a tenant's
      # FAISS index sit right at that edge, so shoppers got intermittent 503s.
      # Billing is per request with scale-to-zero, so this stays in free tier.
      - '--memory'
      - '2Gi'
      - '--allow-unauthenticated'
      # No --set-env-vars here on purpose: deploying with only --image preserves
      # the service's existing environment (MEILI_HOST, MEILI_MASTER_KEY,
      # DATABASE_URL, SECRET_KEY, INDEX_STORAGE, GCS_BUCKET, GCS_PUBLIC_BUCKET,
      # PUBLIC_BACKEND_URL, FRONTEND_URL). Listing them here would put secrets
      # in the repo. Set or change them with `gcloud run services update`.
    id: 'Deploy Backend'
    waitFor: ['Push Backend']

  # 5. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'polarbear-frontend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/polarbear-repo/frontend:${_TAG}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # The backend URL is baked into the frontend image at build time via the
      # NEXT_PUBLIC_API_URL build arg (see the Build Frontend step and the
      # _BACKEND_URL substitution) — NEXT_PUBLIC_* vars cannot be set at runtime.
    id: 'Deploy Frontend'
    # Wait for the backend too. The frontend image is small and would otherwise
    # go live ~20 minutes before the ~2GB backend image finishes pushing,
    # leaving merchants with a new UI calling endpoints that don't exist yet.
    # Backend-first means the overlap is harmless: new endpoints nobody calls.
    waitFor: ['Push Frontend', 'Deploy Backend']

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/polarbear-repo/backend:${_TAG}'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/polarbear-repo/frontend:${_TAG}'

substitutions:
  # This project has no Cloud Build trigger, so $COMMIT_SHA is empty on a
  # manual `gcloud builds submit` and every image name came out as
  # `backend:` with no tag, which the API rejects outright. Pass the commit
  # you are shipping instead:
  #   gcloud builds submit --config cloudbuild.yaml \
  #     --substitutions _TAG=$(git rev-parse --short HEAD) \
  #     --project polarbear-dev-479000
  _TAG: 'latest'
  # Cloud Run URLs are deterministic per service+project; override if yours differs.
  _BACKEND_URL: 'https://polarbear-backend-399780699896.us-central1.run.app'

options:
  logging: CLOUD_LOGGING_ONLY
