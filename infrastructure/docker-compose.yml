services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      - MEILI_MASTER_KEY=masterKey
    ports:
      # Bound to localhost on purpose. The backend reaches Meilisearch over the
      # compose network and does not need this published at all; publishing it
      # on 0.0.0.0 with the default master key would hand every merchant's
      # catalog to anyone who found the host. A developer on their own machine
      # still gets http://localhost:7700.
      - '127.0.0.1:7700:7700'
    volumes:
      - meili_data:/meili_data
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=polarbear
      - POSTGRES_PASSWORD=polarbear
      - POSTGRES_DB=polarbear
    ports:
      # Localhost only, for the same reason as Meilisearch above: these are the
      # default credentials, and the backend talks to Postgres over the compose
      # network regardless.
      - '127.0.0.1:5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  backend:
    build: ../backend
    ports:
      - '8000:8000'
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=masterKey
      - DATABASE_URL=postgresql+asyncpg://polarbear:polarbear@postgres:5432/polarbear
      # Change this before exposing the stack to anyone.
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      - INDEX_STORAGE=local
      - DATA_DIR=/data
      - PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - PORT=8000
    volumes:
      - backend_data:/data
    depends_on:
      - meilisearch
      - postgres
    restart: always

  frontend:
    build:
      context: ../frontend
      args:
        # NEXT_PUBLIC_* is inlined at build time, so the API URL must be a build
        # arg - setting it as a runtime environment variable does nothing.
        NEXT_PUBLIC_API_URL: ${PUBLIC_BACKEND_URL:-http://localhost:8000}
    ports:
      - '3000:3000'
    depends_on:
      - backend
    restart: always

volumes:
  meili_data:
  pg_data:
  backend_data:
